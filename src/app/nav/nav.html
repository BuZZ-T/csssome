<nav class="nav">
  <div class="nav__header">
    <span class="nav__logo">CSS<span class="nav__logo-accent">some</span></span>
    <p class="nav__subtitle">Modern CSS Features</p>
  </div>

  <ul class="nav__list">
    @for (entry of entries(); track entry.id) {
      <li
        class="nav__item"
        [class.nav__item--active]="entry.id === activeId()"
        (click)="select.emit(entry.id)"
      >
        <span class="nav__item-label">{{ entry.label }}</span>
        <code class="nav__item-prop">{{ entry.cssProperty }}</code>
      </li>
    }
  </ul>
</nav>
