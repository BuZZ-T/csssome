<nav class="nav">
  <div class="nav__header">
    <span class="nav__logo">CSS<span class="nav__logo-accent">some</span></span>
    <p class="nav__subtitle">Modern CSS Features</p>
    <p class="nav__catchline">not only awesome, but csssome</p>
  </div>

  <ul class="nav__list">
    @for (entry of entries(); track entry.id) {
      <li>
        <a
          class="nav__item"
          [routerLink]="['/', entry.id]"
          routerLinkActive="nav__item--active"
          ariaCurrentWhenActive="page"
        >
          <span class="nav__item-label">{{ entry.label }}</span>
          <code class="nav__item-prop">{{ entry.cssProperty }}</code>
        </a>
      </li>
    }
  </ul>
</nav>
