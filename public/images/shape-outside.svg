<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Abstract elliptical scene">
  <defs>
    <radialGradient id="bg" cx="34%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#ffd49a" />
      <stop offset="24%" stop-color="#9d91ff" />
      <stop offset="58%" stop-color="#4ad6ff" />
      <stop offset="100%" stop-color="#132038" />
    </radialGradient>
    <radialGradient id="ring" cx="50%" cy="45%" r="56%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
