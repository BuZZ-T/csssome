    <circle cx="530" cy="435" r="124" fill="#2f5f8e" opacity="0.94" />
    <circle cx="295" cy="500" r="138" fill="#1d3349" opacity="0.9" />
    <circle cx="680" cy="545" r="118" fill="#214f53" opacity="0.9" />
    <circle cx="430" cy="590" r="106" fill="#121c32" opacity="0.95" />
