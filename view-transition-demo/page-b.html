<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page B</title>
    <style>
      @view-transition {
        navigation: auto;
      }

      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', system-ui, sans-serif;
        background: #0a0a0f;
        color: #f0f0f5;
      }

      .card {
        width: min(90%, 360px);
        padding: 2.5rem 2rem;
        border-radius: 20px;
        background: #211a39;
        border: 1px solid #3a2e63;
        text-align: center;
        view-transition-name: card;
      }

      .badge {
        width: 128px;
        height: 128px;
        margin: 0 auto 1rem;
        view-transition-name: badge;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: #b7a9f7;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: #7c6af7;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }

      ::view-transition-old(card) {
        animation: fade-slide-out 0.35s ease-in both;
      }

      ::view-transition-new(card) {
        animation: fade-slide-in 0.35s ease-out both;
      }

      @keyframes fade-slide-out {
        to {
          opacity: 0;
          transform: translateX(40px);
        }
      }

      @keyframes fade-slide-in {
        from {
          opacity: 0;
          transform: translateX(-40px);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="badge" src="badge.svg" alt="" width="128" height="128" />
      <h1>Page B</h1>
      <p>This is a real cross-document navigation. The browser matches <code>view-transition-name: card</code> on both pages and animates between their captured snapshots. Notice how the badge image also morphs smoothly from 64&times;64 to 128&times;128 &mdash; that&#8217;s <code>view-transition-name: badge</code> at work.</p>
      <a href="page-a.html">&larr; Back to Page A</a>
    </div>
  </body>
</html>
